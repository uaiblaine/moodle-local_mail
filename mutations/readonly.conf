# Mutation spec of read-only mail (local/mail:viewmail, a frozen course): each guard that
# splits reading from writing, and the test that must redden without it.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/readonly.conf --fast --db pgsql
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/readonly.conf --fast --db mariadb
#
# Not listed: create.php picking the first writable course has no PHPUnit seam (a page
# script); the compose entry points it shares a rule with are held by E3 in entrypoints.conf.
#
# tag | file | perl script

# classes/external.php: reply and forward create a draft, so they need write access.
RO1_reply_skips_write | classes/external.php | ro1_reply_skips_write.pl
#   -> test_external_writes_in_frozen_course

RO2_forward_skips_write | classes/external.php | ro2_forward_skips_write.pl
#   -> test_external_writes_in_frozen_course

# classes/user.php: viewing reads, writing writes.
RO3_view_needs_write | classes/user.php | ro3_view_needs_write.pl
#   -> test_access_checks
#   -> test_external_reads_in_frozen_course

RO6_write_is_read | classes/user.php | ro6_write_is_read.pl
#   -> test_access_checks
#   -> test_external_writes_in_frozen_course
#   -> test_viewmail_without_usemail

# classes/course.php: which courses are readable.
RO4_read_ignores_viewmail | classes/course.php | ro4_read_ignores_viewmail.pl
#   -> test_access_checks
#   -> test_external_reads_in_frozen_course
#   -> test_viewmail_without_usemail

RO5_usemail_not_read | classes/course.php | ro5_usemail_not_read.pl
#   -> test_viewmail_without_usemail

# classes/external.php: course-scoped reads take read access.
RO7_query_needs_write | classes/external.php | ro7_query_needs_write.pl
#   -> test_external_reads_in_frozen_course

RO8_empty_trash_needs_write | classes/external.php | ro8_empty_trash_needs_write.pl
#   -> test_external_reads_in_frozen_course

RO9_canwrite_always | classes/external.php | ro9_canwrite_always.pl
#   -> test_external_reads_in_frozen_course

# db/access.php: viewmail inherits every permission and override of usemail on upgrade.
RO10_no_clone | db/access.php | ro10_no_clone.pl
#   -> test_viewmail_cloned_from_usemail_on_upgrade
