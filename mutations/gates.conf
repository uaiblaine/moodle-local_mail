# Mutation spec of local_mail: each guard the plugins directory work added, and the test that
# must redden without it. Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/gates.conf --fast --db pgsql
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/gates.conf --fast --db mariadb
#
# The /lang/pt_br export-ignore line has no gate: the plugin has no lang/pt_br, so
# test_only_english_strings_ship has nothing to find when the line goes.
#
# tag | file | perl script

# classes/privacy/provider.php: the labels a user keeps in their own user context.
P1_userlist_skips_user_context | classes/privacy/provider.php | p1_userlist_skips_user_context.pl
#   -> test_the_label_owner_is_listed_in_their_user_context

P2_context_delete_skips_labels | classes/privacy/provider.php | p2_context_delete_skips_labels.pl
#   -> test_deleting_a_user_context_removes_its_owners_labels

P3_user_delete_ignores_context_owner | classes/privacy/provider.php | p3_user_delete_ignores_context_owner.pl
#   -> test_deleting_for_a_user_in_another_users_context_keeps_the_labels
#   -> test_deleting_a_user_list_in_a_user_context_removes_only_the_owners_labels

# .gitattributes: what the release package carries.
R1_licence_left_out | .gitattributes | r1_licence_left_out.pl
#   -> test_the_package_carries_a_licence_file

# classes/output/mobile-init.js: the app script joins the boilerplate scan.
R2_app_script_loses_boilerplate | classes/output/mobile-init.js | r2_app_script_loses_boilerplate.pl
#   -> test_source_files_carry_the_boilerplate

# README.md: every table and capability is named.
R3_readme_drops_a_table | README.md | r3_readme_drops_a_table.pl
#   -> test_the_readme_names_tables_capabilities_and_dependencies

R4_readme_drops_a_capability | README.md | r4_readme_drops_a_capability.pl
#   -> test_the_readme_names_tables_capabilities_and_dependencies
