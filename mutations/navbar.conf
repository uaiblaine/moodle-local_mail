# Mutation spec of the navbar probe: course::exists_for_user(), which every page asks through
# local_mail_render_navbar_output(), and the test that must redden without each of its guards.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/navbar.conf --fast --db pgsql
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/navbar.conf --fast --db mariadb
#
# Not listed: the guest/empty-id guard only saves the query (a guest holds no enrolments), and
# "c.id <> :siteid" mirrors enrol_get_all_users_courses() for a site-course enrolment that no
# enrolment plugin creates.
#
# tag | file | perl script

# lib.php: the navbar asks the bounded probe, not the list.
N1_navbar_lists_courses | lib.php | n1_navbar_lists_courses.pl
#   -> test_render_navbar_output_writes_no_cache

# classes/course.php: the probe's two pages.
N2_probe_unbounded | classes/course.php | n2_probe_unbounded.pl
#   -> test_exists_for_user_probe

N3_probe_one_page | classes/course.php | n3_probe_one_page.pl
#   -> test_exists_for_user_probe

# classes/course.php: the probe agrees with get_by_user().
N4_probe_shows_hidden | classes/course.php | n4_probe_shows_hidden.pl
#   -> test_exists_for_user

N5_probe_doanything | classes/course.php | n5_probe_doanything.pl
#   -> test_exists_for_user

N6_probe_suspended | classes/course.php | n6_probe_suspended.pl
#   -> test_exists_for_user

N7_probe_disabled_instance | classes/course.php | n7_probe_disabled_instance.pl
#   -> test_exists_for_user

N8_probe_not_started | classes/course.php | n8_probe_not_started.pl
#   -> test_exists_for_user

N9_probe_ended | classes/course.php | n9_probe_ended.pl
#   -> test_exists_for_user

N10_probe_any_users_list | classes/course.php | n10_probe_any_users_list.pl
#   -> test_exists_for_user_probe
