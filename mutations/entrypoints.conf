# Mutation spec of the "Send mail" entry points on core pages (stage 2 of
# docs/PLAN-contextual-entry-points.md): each guard and the test that must redden without it.
# Run from the main session (fleet rule 6), on both database families:
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/entrypoints.conf --fast --db pgsql
#   mdl mutate moodle-local_mail moodle-local_mail/mutations/entrypoints.conf --fast --db mariadb
#
# Not listed: the "$iscurrentuser ||" test of local_mail_myprofile_navigation() only saves the
# query on one's own profile; can_mail() is false for the current user anyway.
#
# tag | file | perl script

# classes/local/entry_points.php: the shared decisions.
E1_unsaved_setting_off | classes/local/entry_points.php | e1_unsaved_setting_off.pl
#   -> test_enabled

E2_can_mail_anyone | classes/local/entry_points.php | e2_can_mail_anyone.pl
#   -> test_mail_course_and_can_mail
#   -> test_profile_node
#   -> test_profile_page

E3_mail_course_any | classes/local/entry_points.php | e3_mail_course_any.pl
#   -> test_mail_course_and_can_mail

# lib.php: the node in the course profile's contact section.
L1_node_on_global_profile | lib.php | l1_node_on_global_profile.pl
#   -> test_profile_node

L2_node_ignores_setting | lib.php | l2_node_ignores_setting.pl
#   -> test_profile_node

L3_node_ignores_reach | lib.php | l3_node_ignores_reach.pl
#   -> test_profile_node

# classes/hook_callbacks.php: the module on the course profile and the participants page.
H1_header_ignores_setting | classes/hook_callbacks.php | h1_header_ignores_setting.pl
#   -> test_profile_page

H2_profile_ignores_reach | classes/hook_callbacks.php | h2_profile_ignores_reach.pl
#   -> test_profile_page

H3_participants_ignore_setting | classes/hook_callbacks.php | h3_participants_ignore_setting.pl
#   -> test_participants_page

H4_participants_on_site_course | classes/hook_callbacks.php | h4_participants_on_site_course.pl
#   -> test_participants_page
